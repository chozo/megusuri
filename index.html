<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#73d8e9"><title>目薬ゲーム</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body><main class="game-shell"><canvas id="game" aria-label="目薬ゲームのゲーム画面"></canvas><section id="start" class="overlay active"><h1>目薬ゲーム</h1><p class="howto">目薬をさして目の充血を抑えろ！</p><button id="startButton">はじめる</button><p class="hint">画面をタップして一滴落とす</p></section><section id="countdown" class="overlay"><strong id="countdownNumber">3</strong></section><section id="result" class="overlay"><p class="eyebrow">RESULT</p><h2 id="resultMessage">目の疲れがとれなかった</h2><div class="result-stats"><div><span id="resultScore">0</span><small>点数</small></div><div><span id="resultAttempts">0</span><small>挑戦</small></div><div><span id="resultRate">0%</span><small>成功率</small></div></div><button id="retryButton">もう一回</button></section></main><script src="game.js"></script></body></html>
